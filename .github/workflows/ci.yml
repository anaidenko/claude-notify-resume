name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt: Ubuntu ships 0.9.0, which flags things newer releases
      # accept (and vice versa), so `npm run lint` would pass locally and fail
      # here. Fetched directly rather than via a third-party action, so CI runs
      # exactly the command a developer runs.
      - name: Install shellcheck
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          shellcheck --version
      - run: npm run lint

  linux:
    name: Linux suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner is Linux, so the suite runs directly against the distro's
      # own notify-send — no container needed.
      - name: Install libnotify
        run: sudo apt-get update && sudo apt-get install -y libnotify-bin
      - run: ./test/linux-suite.sh

  linux-delivery:
    name: Linux delivery (D-Bus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the daemon actually receives title, body and icon — not just
      # that the right command was built.
      - run: docker build -q -t claude-notify-dbus -f test/Dockerfile.dbus .
      - run: docker run --rm claude-notify-dbus

  macos:
    name: macOS suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run-macos-tests.sh
